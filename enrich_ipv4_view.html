{% extends 'widgets/widget_template.html' %}
{% block widget_content %}
  <div class="cyberint-enrichment" style="padding: 15px; overflow: auto;">
    {% for result in results %}
      <h4 class="widget-title">
        <span class="widget-title-text">IPv4 Enrichment for {{ result.indicator_value }}</span>
      </h4>
      {% if result.data %}
        <pre style="white-space: pre-wrap; word-break: break-word;">{{ result.data_json }}</pre>
      {% else %}
        <p>No enrichment data found.</p>
      {% endif %}
    {% endfor %}
  </div>
{% endblock %}
